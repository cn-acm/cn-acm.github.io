<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《04历史断层，只有我知道班级神人》</title>
    <style>
        /* 全局重置 & 基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f2ed;
            color: #2c2c2c;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* 主卡片 */
        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.10);
            padding: 30px 35px 40px;
            transition: background 0.3s, box-shadow 0.3s;
            position: relative;
        }
        /* 夜间模式 */
        body.dark {
            background: #1a1a1e;
            color: #e0e0e0;
        }
        body.dark .container {
            background: #26262b;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        body.dark .chapter-item {
            background: #2f2f35;
            color: #ddd;
            border-color: #3d3d44;
        }
        body.dark .chapter-item:hover {
            background: #3a3a42;
        }
        body.dark .search-input {
            background: #2f2f35;
            color: #eee;
            border-color: #3d3d44;
        }
        body.dark .btn {
            background: #3d3d44;
            color: #eee;
        }
        body.dark .btn:hover {
            background: #4d4d55;
        }
        body.dark .top-bar {
            border-bottom-color: #3d3d44;
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eae7e2;
            margin-bottom: 25px;
        }
        .top-bar .title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
        }
        .top-bar .title:hover {
            opacity: 0.7;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .controls button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
            color: inherit;
        }
        .controls button:hover {
            background: rgba(128,128,128,0.15);
        }
        .font-size-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .font-size-group button {
            font-size: 1rem;
            padding: 0 8px;
        }
        .font-size-group span {
            min-width: 36px;
            text-align: center;
            font-size: 0.9rem;
        }

        /* 页面容器 */
        .page {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首页 */
        .home-page {
            text-align: center;
            padding: 30px 10px 20px;
        }
        .home-page .book-cover {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 12px;
        }
        .home-page .book-meta {
            font-size: 1rem;
            color: #888;
            margin-bottom: 35px;
        }
        .btn-primary {
            background: #2c2c2c;
            color: #fff;
            border: none;
            padding: 14px 48px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover {
            background: #444;
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        body.dark .btn-primary {
            background: #e0e0e0;
            color: #1a1a1e;
        }
        body.dark .btn-primary:hover {
            background: #fff;
        }

        /* 目录页 */
        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .catalog-header h2 {
            font-weight: 500;
            font-size: 1.5rem;
        }
        .search-input {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #ccc;
            background: #fafafa;
            font-size: 0.95rem;
            width: 200px;
            transition: 0.2s;
            outline: none;
        }
        .search-input:focus {
            border-color: #888;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 6px;
        }
        .chapter-item {
            padding: 14px 20px;
            background: #f8f6f3;
            border-radius: 14px;
            border-left: 4px solid #b0a79a;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chapter-item:hover {
            background: #efebe6;
            transform: translateX(4px);
        }
        .chapter-item .ch-number {
            color: #999;
            font-size: 0.85rem;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .chapter-item .ch-title {
            flex: 1;
        }
        .chapter-item .ch-status {
            font-size: 0.8rem;
            color: #aaa;
        }
        .no-result {
            text-align: center;
            padding: 40px 0;
            color: #999;
        }

        /* 阅读页 */
        .reading-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .reading-header .back-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: inherit;
            padding: 6px 12px;
            border-radius: 30px;
            transition: background 0.2s;
        }
        .reading-header .back-btn:hover {
            background: rgba(128,128,128,0.12);
        }
        .reading-header .chapter-title {
            font-size: 1.3rem;
            font-weight: 600;
        }
        .reading-content {
            font-size: 1.1rem;
            line-height: 1.9;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 10px 0 20px;
            min-height: 40vh;
        }
        .reading-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eae7e2;
            flex-wrap: wrap;
            gap: 12px;
        }
        .reading-footer button {
            background: none;
            border: 1px solid #ccc;
            border-radius: 30px;
            padding: 8px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            color: inherit;
            background: transparent;
        }
        .reading-footer button:hover:not(:disabled) {
            background: #eee;
        }
        .reading-footer button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        body.dark .reading-footer button:hover:not(:disabled) {
            background: #3d3d44;
        }
        body.dark .reading-footer {
            border-top-color: #3d3d44;
        }

        /* 滚动条美观 */
        .chapter-list::-webkit-scrollbar {
            width: 6px;
        }
        .chapter-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 8px;
        }
        body.dark .chapter-list::-webkit-scrollbar-thumb {
            background: #555;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container { padding: 20px 18px; }
            .top-bar .title { font-size: 1.1rem; }
            .home-page .book-cover { font-size: 2.2rem; }
            .search-input { width: 140px; }
            .chapter-item { padding: 12px 16px; }
            .reading-content { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 顶部栏（通用） -->
        <div class="top-bar">
            <div class="title" id="mainTitle" title="回到首页">📖 历史断层</div>
            <div class="controls">
                <div class="font-size-group">
                    <button id="fontDec" title="减小字号">A-</button>
                    <span id="fontSizeDisplay">16</span>
                    <button id="fontInc" title="增大字号">A+</button>
                </div>
                <button id="themeToggle" title="切换夜间模式">🌙</button>
            </div>
        </div>

        <!-- ========== 首页 ========== -->
        <div class="page home-page active" id="homePage">
            <div class="book-cover">《04历史断层，<br>只有我知道班级神人》</div>
            <div class="book-meta">📚 共 <span id="totalChapters">0</span> 章 · 点击下方开始阅读</div>
            <button class="btn-primary" id="goCatalogBtn">📂 进入目录</button>
        </div>

        <!-- ========== 目录页 ========== -->
        <div class="page" id="catalogPage">
            <div class="catalog-header">
                <h2>📑 目录</h2>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索章节..." />
            </div>
            <div class="chapter-list" id="chapterList">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- ========== 阅读页 ========== -->
        <div class="page" id="readingPage">
            <div class="reading-header">
                <button class="back-btn" id="backToCatalogBtn">← 返回目录</button>
                <span class="chapter-title" id="readingChapterTitle">章节名</span>
                <span style="width: 70px;"></span> <!-- 占位对齐 -->
            </div>
            <div class="reading-content" id="readingContent">
                加载中...
            </div>
            <div class="reading-footer">
                <button id="prevChapterBtn" disabled>上一章</button>
                <span id="chapterIndicator">1 / 1</span>
                <button id="nextChapterBtn" disabled>下一章</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ======================== 小说数据 ========================
            // 按顺序定义所有章节，文件名对应 chapters/ 下的 txt 文件
            const CHAPTERS = [
                { title: '第一章 奇怪的转学生', file: 'chapter1.txt' },
                { title: '第二章 历史课的异常', file: 'chapter2.txt' },
                { title: '第三章 只有我知道的秘密', file: 'chapter3.txt' },
                { title: '第四章 班级神人的真面目', file: 'chapter4.txt' },
                { title: '第五章 时间线的裂痕', file: 'chapter5.txt' },
                // 你可以在这里继续添加，文件名记得和 chapters/ 目录下的一致
            ];

            // ======================== 状态 ========================
            let currentChapterIndex = 0;          // 当前阅读的章节索引
            let filteredChapters = [...CHAPTERS]; // 搜索过滤后的列表
            let fontSize = 16;                   // 默认字号

            // DOM 元素
            const homePage = document.getElementById('homePage');
            const catalogPage = document.getElementById('catalogPage');
            const readingPage = document.getElementById('readingPage');
            const chapterListEl = document.getElementById('chapterList');
            const searchInput = document.getElementById('searchInput');
            const readingContent = document.getElementById('readingContent');
            const readingChapterTitle = document.getElementById('readingChapterTitle');
            const prevBtn = document.getElementById('prevChapterBtn');
            const nextBtn = document.getElementById('nextChapterBtn');
            const chapterIndicator = document.getElementById('chapterIndicator');
            const totalChaptersSpan = document.getElementById('totalChapters');
            const fontDisplay = document.getElementById('fontSizeDisplay');
            const mainTitle = document.getElementById('mainTitle');

            // ======================== 辅助函数 ========================
            // 切换页面
            function showPage(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
            }

            // 渲染目录
            function renderCatalog(filterArray) {
                if (!filterArray) filterArray = filteredChapters;
                if (filterArray.length === 0) {
                    chapterListEl.innerHTML = `<div class="no-result">📭 没有找到匹配的章节</div>`;
                    return;
                }
                let html = '';
                filterArray.forEach((ch, idx) => {
                    // 找到在 CHAPTERS 中的真实索引
                    const realIndex = CHAPTERS.indexOf(ch);
                    html += `
                        <div class="chapter-item" data-index="${realIndex}">
                            <span class="ch-number">第 ${realIndex+1} 章</span>
                            <span class="ch-title">${ch.title}</span>
                            <span class="ch-status">📄</span>
                        </div>
                    `;
                });
                chapterListEl.innerHTML = html;
                // 绑定点击事件
                chapterListEl.querySelectorAll('.chapter-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        openChapter(idx);
                    });
                });
            }

            // 打开章节
            function openChapter(index) {
                if (index < 0 || index >= CHAPTERS.length) return;
                currentChapterIndex = index;
                const ch = CHAPTERS[index];
                // 更新标题
                readingChapterTitle.textContent = ch.title;
                // 显示加载
                readingContent.textContent = '加载中...';
                // 加载 txt 文件
                fetch(`chapters/${ch.file}`)
                    .then(res => {
                        if (!res.ok) throw new Error('文件不存在');
                        return res.text();
                    })
                    .then(text => {
                        readingContent.textContent = text;
                        // 更新按钮状态
                        updateNavButtons();
                        // 保存阅读进度
                        localStorage.setItem('lastChapter', index);
                    })
                    .catch(err => {
                        readingContent.textContent = `⚠️ 无法加载章节内容，请确保 chapters/${ch.file} 文件存在。\n错误信息：${err.message}`;
                    });
                // 切换到阅读页
                showPage('readingPage');
                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // 更新上一章/下一章按钮状态
            function updateNavButtons() {
                prevBtn.disabled = (currentChapterIndex === 0);
                nextBtn.disabled = (currentChapterIndex === CHAPTERS.length - 1);
                chapterIndicator.textContent = `${currentChapterIndex+1} / ${CHAPTERS.length}`;
            }

            // 切换夜间模式
            function toggleTheme() {
                document.body.classList.toggle('dark');
                const btn = document.getElementById('themeToggle');
                btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
                localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
            }

            // 设置字号
            function setFontSize(size) {
                fontSize = Math.min(28, Math.max(12, size));
                document.querySelector('.reading-content').style.fontSize = fontSize + 'px';
                fontDisplay.textContent = fontSize;
                localStorage.setItem('fontSize', fontSize);
            }

            // ======================== 初始化 ========================
            function init() {
                // 设置总章数
                totalChaptersSpan.textContent = CHAPTERS.length;

                // 恢复主题
                if (localStorage.getItem('theme') === 'dark') {
                    document.body.classList.add('dark');
                    document.getElementById('themeToggle').textContent = '☀️';
                }

                // 恢复字号
                const savedFont = parseInt(localStorage.getItem('fontSize'), 10);
                if (savedFont) setFontSize(savedFont);
                else setFontSize(16);

                // 恢复阅读进度
                const last = parseInt(localStorage.getItem('lastChapter'), 10);
                if (!isNaN(last) && last >= 0 && last < CHAPTERS.length) {
                    currentChapterIndex = last;
                } else {
                    currentChapterIndex = 0;
                }

                // 初始渲染目录（全部）
                filteredChapters = [...CHAPTERS];
                renderCatalog(filteredChapters);

                // 默认显示首页
                showPage('homePage');

                // ---- 事件绑定 ----
                // 点击标题回到首页
                mainTitle.addEventListener('click', function() {
                    showPage('homePage');
                });

                // 首页“进入目录”
                document.getElementById('goCatalogBtn').addEventListener('click', function() {
                    showPage('catalogPage');
                    // 刷新目录（清除搜索）
                    searchInput.value = '';
                    filteredChapters = [...CHAPTERS];
                    renderCatalog(filteredChapters);
                });

                // 返回目录（阅读页返回）
                document.getElementById('backToCatalogBtn').addEventListener('click', function() {
                    showPage('catalogPage');
                    // 刷新目录（保持搜索状态？我们重置搜索）
                    searchInput.value = '';
                    filteredChapters = [...CHAPTERS];
                    renderCatalog(filteredChapters);
                });

                // 搜索
                searchInput.addEventListener('input', function() {
                    const keyword = this.value.trim().toLowerCase();
                    if (keyword === '') {
                        filteredChapters = [...CHAPTERS];
                    } else {
                        filteredChapters = CHAPTERS.filter(ch => ch.title.toLowerCase().includes(keyword));
                    }
                    renderCatalog(filteredChapters);
                });

                // 上一章
                prevBtn.addEventListener('click', function() {
                    if (currentChapterIndex > 0) {
                        openChapter(currentChapterIndex - 1);
                    }
                });

                // 下一章
                nextBtn.addEventListener('click', function() {
                    if (currentChapterIndex < CHAPTERS.length - 1) {
                        openChapter(currentChapterIndex + 1);
                    }
                });

                // 主题切换
                document.getElementById('themeToggle').addEventListener('click', toggleTheme);

                // 字体大小
                document.getElementById('fontInc').addEventListener('click', function() {
                    setFontSize(fontSize + 2);
                });
                document.getElementById('fontDec').addEventListener('click', function() {
                    setFontSize(fontSize - 2);
                });

                // 如果存在进度，自动打开上次阅读章节（但用户可能想从首页开始，我们仅在用户点击目录或小说名时触发，不自动跳转）
                // 但我们可以提供一个“继续阅读”的提示？目前先不做，用户点击目录后自行选择。
                // 不过我们可以让“进入目录”后高亮上次阅读的章节？更友好。
                // 简单起见，在目录渲染时，我们可以标记已读章节，但没必要。
                // 我们可以在首页显示“上次读到第X章”，但先不复杂化。
                // 如果想自动打开，可以取消注释下面两行：
                // if (currentChapterIndex > 0) {
                //     // 可选：打开上次阅读章节，但用户可能希望先看目录。这里我们不做自动跳转。
                // }
            }

            // 等DOM加载完初始化
            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
